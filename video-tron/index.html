<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Videotron Display</title>
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000; 
            overflow: hidden; 
        }

        #bg-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover; /* Video akan proporsional dan penuh saat layar lanskap */
            z-index: 1; 
            pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- Atribut "autoplay" dihapus agar bisa dikontrol oleh JavaScript -->
    <video id="bg-video" loop muted playsinline>
        <source src="https://zeinniko.github.io/video-tron/video.mp4" type="video/mp4">
    </video>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const video = document.getElementById("bg-video");
            
            // Mengecek apakah tinggi layar lebih besar dari lebarnya (Portrait / HP berdiri)
            if (window.innerHeight > window.innerWidth) {
                alert("Please landscape your device");
            }
            
            // Memutar video setelah alert ditutup (klik OK) atau langsung diputar jika sudah lanskap
            video.play().catch(function(error) {
                console.log("Autoplay error:", error);
            });
        });
    </script>

</body>
</html>
