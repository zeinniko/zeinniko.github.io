<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Videotron Display</title>
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000; 
            overflow: hidden; 
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #bg-video {
            width: 100vw;
            height: 100vh;
            object-fit: contain; 
            pointer-events: none; 
            z-index: 1;
        }

        /* Styling untuk area klik (Invisible Hitbox) */
        #email-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%); /* Memastikan posisi benar-benar di tengah */
            z-index: 10;
            width: 60%; /* Lebar area yang bisa diklik */
            height: 40%; /* Tinggi area yang bisa diklik */
            background-color: transparent; /* Dibuat tembus pandang 100% */
            display: none; 
            cursor: pointer;
        }
    </style>
</head>
<body>

    <video id="bg-video" loop muted playsinline>
        <source src="https://zeinniko.github.io/video-tron/video.mp4" type="video/mp4">
    </video>

    <!-- Elemen link email dibiarkan kosong tanpa teks -->
    <a href="mailto:wxc@worxcode.io" id="email-overlay"></a>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const video = document.getElementById("bg-video");
            const emailOverlay = document.getElementById("email-overlay");
            
            // Mengecek layout layar
            if (window.innerHeight > window.innerWidth) {
                alert("For a better experience, please switch to landscape layout");
            }
            
            // Memutar video
            video.play().catch(function(error) {
                console.log("Autoplay error:", error);
            });

            // Timer deteksi detik video
            video.addEventListener("timeupdate", function() {
                // Diubah menjadi detik ke-12 sampai ke-14
                if (video.currentTime >= 12 && video.currentTime <= 14) {
                    emailOverlay.style.display = "block";
                } else {
                    emailOverlay.style.display = "none";
                }
            });
        });
    </script>

</body>
</html>
