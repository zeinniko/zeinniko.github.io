<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Videotron Display</title>
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000; /* Warna hitam untuk space kosong */
            overflow: hidden; 
        }

        #bg-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            /* Diubah menjadi contain agar video utuh & menyesuaikan rasio aslinya */
            object-fit: contain; 
            z-index: 1; 
            pointer-events: none;
        }
    </style>
</head>
<body>

    <video id="bg-video" loop muted playsinline>
        <source src="https://zeinniko.github.io/video-tron/video.mp4" type="video/mp4">
    </video>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const video = document.getElementById("bg-video");
            
            // Mengecek apakah layar dalam mode portrait (HP berdiri)
            if (window.innerHeight > window.innerWidth) {
                // Alert baru sesuai permintaan klien
                alert("For a better experience, please switch to landscape layout");
            }
            
            // Memutar video otomatis setelah alert ditutup
            video.play().catch(function(error) {
                console.log("Autoplay error:", error);
            });
        });
    </script>

</body>
</html>
