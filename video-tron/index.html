<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Videotron Display</title>
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000; 
            overflow: hidden; 
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #bg-video {
            width: 100vw;
            height: 100vh;
            object-fit: contain; 
            pointer-events: none; 
            z-index: 1;
        }

        /* Styling untuk area klik (Invisible Hitbox) */
        #email-overlay {
            position: absolute;
            /* Dinaikkan sedikit posisinya ke atas */
            top: 53%; 
            left: 55%;
            transform: translate(-50%, -50%);
            z-index: 10;
            
            /* Lebar dipertahankan, tinggi dikurangi sedikit */
            width: 40%; 
            height: 10%; 
            
            background-color: transparent;
            display: none; 
            cursor: pointer;
        }
    </style>
</head>
<body>

    <video id="bg-video" loop muted playsinline>
        <source src="https://zeinniko.github.io/video-tron/video.mp4" type="video/mp4">
    </video>

    <!-- Elemen link email dibiarkan kosong tanpa teks -->
    <a href="mailto:wxc@worxcode.io" id="email-overlay">KLIK DISINI AJA</a>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const video = document.getElementById("bg-video");
            const emailOverlay = document.getElementById("email-overlay");
            
            // Variabel penanda agar tidak pause berulang kali
            let hasPaused = false; 
            
            // Memutar video
            video.play().catch(function(error) {
                console.log("Autoplay error:", error);
            });

            // Timer deteksi detik video
            video.addEventListener("timeupdate", function() {
                
                // 1. Reset penanda saat video mengulang (loop) ke detik awal
                if (video.currentTime < 5) {
                    hasPaused = false;
                }

                // 2. Munculkan area klik email di antara detik ke-12 sampai ke-14
                if (video.currentTime >= 12 && video.currentTime <= 14) {
                    emailOverlay.style.display = "block";
                } else {
                    emailOverlay.style.display = "none";
                }

                // 3. Logika Pause selama 5 detik tepat di detik ke-13
                if (video.currentTime >= 13 && !hasPaused) {
                    video.pause(); // Hentikan video sementara
                    hasPaused = true; // Kunci supaya pause tidak tereksekusi berkali-kali

                    // Tunggu 5 detik (5000 ms), lalu mainkan kembali
                    setTimeout(function() {
                        video.play().catch(function(error) {
                            console.log("Resume play error:", error);
                        });
                    }, 5000);
                }
            });
        });
    </script>

</body>
</html>
